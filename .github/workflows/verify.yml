name: Verify public dataset

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and extract the OSM-only archive
        run: python scripts/verify_dataset.py --extract
      - name: Install research and reference-validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Test route projection and recorded stop order
        run: python -m unittest discover -s tests -v
      - name: Reproduce the initial route audit
        run: python -m research.src.extract_routes
      - name: Build walking connectors and street dependencies
        run: python -m research.src.build_connections
      - name: Audit stored graph and dependency lengths
        run: python -m research.src.audit_connections
      - name: Compute the structural accessibility baseline
        run: python -m research.src.accessibility
      - name: Test all observed single street closures
        run: python -m research.src.single_closures --baseline research/runs/m3-baseline-v1/summary.json
      - name: Reconcile saved closure artifacts with source dependencies
        run: python -m research.src.audit_closures --directory research/runs/m3-single-closures-v1
      - name: Audit every physical pair and the complete interaction tables
        run: python -m research.src.audit_pairs
      - name: Verify all frozen validation evidence and walking baseline
        run: python -m research.src.verify_full_validation
